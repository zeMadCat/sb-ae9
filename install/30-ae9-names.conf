# Friendly PipeWire node names for the Sound Blaster AE-9.
# Without this the ACP-generated analog sink/source show up as
# "CA0132 Sound Core3D [Sound Blaster AE-7/AE-9] (Sound Blaster AE-9) ...".
# The extra sources from 20-ae9-inputs.conf already carry their own names.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*analog-stereo"
        alsa.mixer_name = "Creative Sound Blaster AE-9" }
    ]
    actions = {
      update-props = {
        node.description = "Sound Blaster AE-9 Output"
        node.nick = "AE-9 Output"
      }
    }
  },
  {
    matches = [
      { node.name = "~alsa_input.*analog-stereo"
        alsa.mixer_name = "Creative Sound Blaster AE-9" }
    ]
    actions = {
      update-props = {
        node.description = "Sound Blaster AE-9 Microphone"
        node.nick = "AE-9 Mic"
      }
    }
  },
  {
    matches = [
      { node.name = "~alsa_output.*iec958-stereo"
        alsa.mixer_name = "Creative Sound Blaster AE-9" }
    ]
    actions = {
      update-props = {
        node.description = "Sound Blaster AE-9 S/PDIF (internal)"
        node.nick = "AE-9 S/PDIF int"
        priority.session = 0
      }
    }
  }
]

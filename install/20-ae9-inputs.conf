# Sound Blaster AE-9 extra capture sources.
# The card's ACP profile only exposes the main-codec microphone; the rear
# line-in is the secondary codec (ALSA hw:Creative,4), What U Hear is the
# DSP loopback (hw:Creative,2) and S/PDIF input is the digital receiver
# (hw:Creative,10). Expose them as PipeWire sources so desktop applications
# (Audacity, OBS, etc.) can select them.
context.objects = [
    { factory = adapter
      args = {
        factory.name     = api.alsa.pcm.source
        node.name        = "alsa_input.ae9_linein"
        node.description = "Sound Blaster AE-9 Line In"
        media.class      = "Audio/Source"
        api.alsa.path    = "hw:Creative,4"
        audio.format     = "S32LE"
        audio.channels   = 2
        audio.position   = [ FL FR ]
      }
    },
    { factory = adapter
      args = {
        factory.name     = api.alsa.pcm.source
        node.name        = "alsa_input.ae9_wuh"
        node.description = "Sound Blaster AE-9 What U Hear"
        media.class      = "Audio/Source"
        api.alsa.path    = "hw:Creative,2"
        audio.format     = "S32LE"
        audio.channels   = 2
        audio.position   = [ FL FR ]
      }
    },
    { factory = adapter
      args = {
        factory.name     = api.alsa.pcm.source
        node.name        = "alsa_input.ae9_spdif"
        node.description = "Sound Blaster AE-9 S/PDIF"
        media.class      = "Audio/Source"
        api.alsa.path    = "hw:Creative,10"
        audio.format     = "S32LE"
        audio.channels   = 2
        audio.position   = [ FL FR ]
      }
    },
    { factory = adapter
      args = {
        factory.name     = api.alsa.pcm.sink
        node.name        = "alsa_output.ae9_spdif"
        node.description = "Sound Blaster AE-9 Optical S/PDIF"
        media.class      = "Audio/Sink"
        api.alsa.path    = "hw:Creative,10"
        audio.format     = "S32LE"
        audio.channels   = 2
        audio.position   = [ FL FR ]
        priority.session = 1000
      }
    }
]
